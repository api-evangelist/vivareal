description: VivaReal operates vivareal.com.br, a Brazilian online real estate marketplace and
  classifieds portal where consumers search, buy, sell, and rent residential and commercial
  properties across Brazil, connecting property seekers with real estate agents, agencies, and
  developers. It was originally backed by 500 Global and later became part of Grupo ZAP / OLX Brasil.
  It was surfaced as a portfolio company and added to the API Evangelist network for enrichment; an
  enrichment pass found no public developer API surface, portal, or specification.
